name: CI

# Runs on every pull request. The release workflow also calls it, so nothing
# reaches a release without passing the same checks.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  web:
    name: Web (wasm, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build wasm
        run: npm run build:wasm
      - name: Unit tests
        run: npm test
      - name: Build (typecheck + vite)
        run: npm run build
      # The e2e job and the release reuse these instead of rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e:
    name: End-to-end tests (Playwright)
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
      # The GitHub Ubuntu runners ship Google Chrome, which the config uses by default.
      - name: Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
