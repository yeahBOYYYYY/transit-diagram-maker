[workspace]
resolver = "2"
members = ["crates/transit-core", "crates/transit-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
